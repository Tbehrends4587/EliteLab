name: CI

on:
  push:
    branches: [ main, master, development, feat/personal-trading ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, fixture journal)
        run: python -m unittest discover -s tests -v
      - name: Module manifest check
        run: python -m elitelab modules

  frontend:
    name: Front-end syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check every script
        run: |
          set -e
          for f in web/*.js modules/*/web/*.js; do node --input-type=module --check < "$f"; done
      - name: Individual profit estimates
        run: node tests/profits.mjs

  windows-bundle:
    name: Portable Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build with checksum-verified embedded Python
        run: python scripts/build_windows.py
      - name: Launch extracted bundle without system Python on PATH
        run: python scripts/smoke_windows_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: EliteLab-windows-x64
          path: |
            dist/EliteLab-windows-x64.zip
            dist/EliteLab-windows-x64.zip.sha256
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t elitelab:ci .
      - name: Smoke test against the fixture journal
        run: |
          set -euo pipefail
          trap 'docker logs lab || true; docker rm -f lab || true' EXIT
          docker run -d --name lab -p 8766:8766 -v "$PWD/tests/fixtures/journals:/journals:ro" -e ELITELAB_OFFLINE=1 elitelab:ci
          for i in $(seq 1 45); do
            if [ "$(docker inspect -f '{{.State.Running}}' lab)" != true ]; then
              echo "Container exited before becoming ready" >&2
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:8766/api/health -o /tmp/lab-health.json &&
               curl -fsS --max-time 2 http://127.0.0.1:8766/api/journal -o /tmp/lab-journal.json &&
               python3 -c "import json; h=json.load(open('/tmp/lab-health.json')); j=json.load(open('/tmp/lab-journal.json')); assert h.get('ready') and j.get('cmdr')=='Testpilot'; print('ok', j['ship'])"; then
              exit 0
            fi
            sleep 1
          done
          echo "Dashboard or fixture replay did not become ready within 45 attempts" >&2
          exit 1
